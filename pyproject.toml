[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nightsift"
version = "1.0.0"
description = "Fast two-stage culling of astrophotography FITS subframes: auto-flag, then blink."
requires-python = ">=3.10"
dependencies = ["numpy", "sep", "opencv-python", "PySide6"]
classifiers = ["License :: OSI Approved :: GNU General Public License v2 (GPLv2)"]

[project.scripts]
nightsift = "nightsift.cli:main"

[tool.setuptools]
packages = ["nightsift"]

[tool.setuptools.package-data]
nightsift = ["icon.ico", "icon.png"]
